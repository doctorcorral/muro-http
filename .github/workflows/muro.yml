name: muro

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: erlef/setup-beam@v1
        with:
          elixir-version: "1.20.4"
          otp-version: "29.1"

      - uses: actions/cache@v4
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-otp-29.1-elixir-1.20.4-mix-${{ hashFiles('mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-otp-29.1-elixir-1.20.4-mix-

      - name: Fetch dependencies
        run: mix deps.get

      - name: Check formatting
        run: mix format --check-formatted

      - name: Check books and generated modules
        run: mix muro.gen --check

      - name: Test
        run: mix test

      - name: Build and run the C classify driver
        run: |
          cc -Wall -Wextra -Werror -std=c11 -I c -I c/generated -include c/shim.h \
            -c -o c/test_classify.o c/test_classify.c
          cc -Wall -Wextra -Werror -std=c11 -I c -c -o c/shim.o c/shim.c
          cc -Wall -Wextra -Werror -std=c11 \
            -I c -I c/generated -include c/shim.h \
            -c -o c/request.o c/generated/request.c
          cc -o c/test_classify c/test_classify.o c/request.o c/shim.o
          ./c/test_classify

      - name: Build and run the C connection driver
        run: |
          cc -Wall -Wextra -Werror -std=c11 -I c -I c/generated -include c/shim.h \
            -c -o c/test_conn.o c/test_conn.c
          cc -Wall -Wextra -Werror -std=c11 -I c -c -o c/shim.o c/shim.c
          cc -Wall -Wextra -Werror -std=c11 \
            -I c -I c/generated -include c/shim.h \
            -c -o c/conn.o c/generated/conn.c
          cc -Wall -Wextra -Werror -std=c11 \
            -I c -I c/generated -include c/shim.h \
            -c -o c/session.o c/generated/session.c
          cc -Wall -Wextra -Werror -std=c11 -I c -I c/generated \
            -c -o c/proto.o c/proto.c
          cc -o c/test_conn c/test_conn.o c/conn.o c/session.o c/proto.o c/shim.o
          ./c/test_conn

      - name: Build and run the C session stepper
        run: |
          cc -Wall -Wextra -Werror -std=c11 \
            -I c -I c/generated -include c/shim.h \
            -c -o c/session.o c/generated/session.c
          cc -Wall -Wextra -Werror -std=c11 -I c -I c/generated \
            -c -o c/test_sess.o c/test_sess.c
          cc -Wall -Wextra -Werror -std=c11 -I c -c -o c/shim.o c/shim.c
          cc -o c/test_sess c/test_sess.o c/session.o c/shim.o
          ./c/test_sess
