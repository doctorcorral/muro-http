name: muro

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: erlef/setup-beam@v1
        with:
          elixir-version: "1.20.4"
          otp-version: "29.1"

      - uses: actions/cache@v4
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-otp-29.1-elixir-1.20.4-mix-${{ hashFiles('mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-otp-29.1-elixir-1.20.4-mix-

      - name: Fetch dependencies
        run: mix deps.get

      - name: Check formatting
        run: mix format --check-formatted

      - name: Check books and generated modules
        run: mix run script/check_generated.exs

      - name: Test
        run: mix test

      - name: Build and run the C classify driver
        run: |
          cc -Wall -Wextra -Werror -std=c11 -I c -I c/generated -include c/shim.h \
            -c -o c/test_classify.o c/test_classify.c
          cc -Wall -Wextra -Werror -std=c11 -I c -c -o c/shim.o c/shim.c
          cc -Wall -Wextra -Werror -Wno-missing-field-initializers \
            -Wno-unused-variable -Wno-unused-function -std=c11 \
            -I c -I c/generated -include c/shim.h \
            -c -o c/request.o c/generated/request.c
          cc -o c/test_classify c/test_classify.o c/request.o c/shim.o
          ./c/test_classify
